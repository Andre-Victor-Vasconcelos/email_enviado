<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-mail Enviado com Sucesso</title>
    
    <!-- Redirecionamento automático após 2 segundos -->
    <meta http-equiv="refresh" content="2;url=https://curriculoon.netlify.app/">
</head>

<body style="margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-image: linear-gradient(to right, #303232, #686b6c); font-family: Arial, Helvetica, sans-serif; color: white;">

    <!-- Cartão centralizado -->
    <div style="background-color: #1d1d39; padding: 40px 30px; border-radius: 15px; box-shadow: 5px 5px 20px rgba(0, 0, 0, 0.6); text-align: center; max-width: 90%; width: 450px; border-top: 6px solid #0d2c38; box-sizing: border-box;">

        <!-- Ícone de Sucesso -->
        <div style="font-size: 60px; color: #4CAF50; margin-bottom: 15px;">
            &#10004;
        </div>

        <!-- Título -->
        <h1 style="font-size: 24px; margin: 0 0 15px 0; color: #ffffff; letter-spacing: 1px;">
            Seu e-mail foi enviado com sucesso!
        </h1>

        <!-- Mensagem -->
        <p style="font-size: 16px; color: #cfcfcf; margin-bottom: 30px; line-height: 1.5;">
            Clique no botão abaixo para voltar ou aguarde <strong style="color: white;">2 segundos</strong> para ser redirecionado automaticamente.
        </p>

        <!-- Botão de Voltar -->
        <a href="https://curriculoon.netlify.app/" style="display: inline-block; padding: 12px 30px; background-image: linear-gradient(to right, #00001d, #090722); color: white; text-decoration: none; font-weight: bold; font-size: 16px; border-radius: 8px; border: 1px solid #686b6c; box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.4); text-transform: uppercase;">
            Voltar ao site
        </a>

    </div>

</body>
</html>
